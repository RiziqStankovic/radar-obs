{{- if and .Values.config.clickhouse.existingSecret (or .Values.config.clickhouse.user .Values.config.clickhouse.password) }}
{{- fail "set either config.clickhouse.existingSecret or inline credentials, not both" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "radar-gateway.fullname" . }}-config
  labels:
    {{- include "radar-gateway.labels" . | nindent 4 }}
data:
  RADAR_GATEWAY_PORT: {{ .Values.config.port | quote }}
  RADAR_CLICKHOUSE_URL: {{ .Values.config.clickhouse.url | quote }}
  RADAR_CLICKHOUSE_DATABASE: {{ .Values.config.clickhouse.database | quote }}
