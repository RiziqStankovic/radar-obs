apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radar-gateway.fullname" . }}
  labels:
    {{- include "radar-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "radar-gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "radar-gateway.labels" . | nindent 8 }}
    spec:
      containers:
        - name: radar-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "radar-gateway.fullname" . }}-config
          env:
            - name: RADAR_CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.clickhouse.existingSecret | default (printf "%s-clickhouse" (include "radar-gateway.fullname" .)) }}
                  key: {{ .Values.config.clickhouse.userKey | default "username" }}
            - name: RADAR_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.clickhouse.existingSecret | default (printf "%s-clickhouse" (include "radar-gateway.fullname" .)) }}
                  key: {{ .Values.config.clickhouse.passwordKey | default "password" }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
