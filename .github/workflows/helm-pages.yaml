name: Publish Helm charts

on:
  push:
    branches:
      - main
      - master
    paths:
      - "radar-agent-chart/**"
      - ".github/workflows/helm-pages.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate chart
        run: |
          helm dependency update radar-agent-chart
          helm lint radar-agent-chart

      - name: Publish chart repo to gh-pages
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: .
          skip_existing: true
