name: Publish Helm charts

on:
  push:
    branches:
      - main
      - master
    paths:
      - "radar-agent-chart/**"
      - ".github/workflows/helm-pages.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p .helm-repo
          helm dependency update radar-agent-chart
          helm lint radar-agent-chart
          helm package radar-agent-chart --destination .helm-repo

      - name: Generate Helm repository index
        run: |
          set -euo pipefail
          REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "${REPO_URL}/index.yaml" -o .helm-repo/old-index.yaml || true
          if [ -s .helm-repo/old-index.yaml ]; then
            helm repo index .helm-repo --url "${REPO_URL}" --merge .helm-repo/old-index.yaml
            rm .helm-repo/old-index.yaml
          else
            helm repo index .helm-repo --url "${REPO_URL}"
          fi

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .helm-repo
          keep_files: true
