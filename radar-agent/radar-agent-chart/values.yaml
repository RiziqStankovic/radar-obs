global:
  name: radar-agent
  clusterId: ""
  tenantId: ""

agent:
  enabled: true
  image:
    repository: ziq02/radar-agent
    tag: main
    pullPolicy: Always
  ports:
    health: 13133
    otlpGrpc: 4317
    otlpHttp: 4318
  config:
    healthEndpoint: 0.0.0.0:13133
    gatewayOtlpEndpoint: http://radar-gateway:4318
    gatewayApiKey: ""
    hostMetricsInterval: 30s
    kubeletMetricsInterval: 30s
    kubeletEndpoint: https://${K8S_NODE_IP}:10250
    kubeletInsecureSkipVerify: false
    hostRootPath: /hostfs
  collectors:
    node:
      enabled: true
      hostMetrics: true
      kubeletMetrics: true
      logs: true
    otlp:
      enabled: true
    cluster:
      enabled: false
      ownership: leader
      leaseName: radar-cluster-collector
    database:
      enabled: false
      ownership: leader
      leaseName: radar-database-collector
      targets: []
      # Example target. username/password are Secret keys, not plaintext values.
      # - name: mysql-main
      #   engine: mysql
      #   endpoint: mysql.database.svc.cluster.local:3306
      #   database: app
      #   existingSecret: radar-mysql-monitoring
      #   usernameKey: username
      #   passwordKey: password
      #   interval: 30s
    qan:
      enabled: false
      ownership: leader
      leaseName: radar-qan-collector
      includeQueryExamples: false
      dsn: ""
      serviceName: postgresql
      interval: 60s
      targets: []
      # Targets are metadata for the database QAN adapter. Credentials must
      # come from Kubernetes Secrets, never from this values file.
      # Example:
      # - name: mysql-main
      #   databaseTarget: mysql-main
      #   interval: 60s
      #   includeQueryExamples: false
  gateway:
    endpoint: ""
    existingSecret: ""
  resources: {}
  tolerations: []
  nodeSelector: {}
  affinity: {}

rbac:
  create: true

service:
  enabled: true
  internalTrafficPolicy: Local
