# OCB distribution for the independently deployed radar-agent.
# Keep this pinned to the same Contrib release as radar-gateway and homelab.
dist:
  module: gitrepo.xlaxiata.id/radar/radar-agent-collector
  name: radar-agent
  description: Radar node-local OpenTelemetry Collector
  version: 0.158.0
  output_path: ./generated
  otelcol_version: 0.158.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.158.0
  - gomod: gitrepo.xlaxiata.id/radar/radar-agent-otel-modules v0.0.0
    import: gitrepo.xlaxiata.id/radar/radar-agent-otel-modules/receiver/postgresqanreceiver
    path: ./otel-modules
  - gomod: gitrepo.xlaxiata.id/radar/radar-agent-otel-modules v0.0.0
    import: gitrepo.xlaxiata.id/radar/radar-agent-otel-modules/receiver/clusterreceiver
    path: ./otel-modules

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.158.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.158.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.158.0
  - gomod: gitrepo.xlaxiata.id/radar/radar-agent-otel-modules v0.0.0
    import: gitrepo.xlaxiata.id/radar/radar-agent-otel-modules/exporter/radarqanexporter
    path: ./otel-modules
  - gomod: gitrepo.xlaxiata.id/radar/radar-agent-otel-modules v0.0.0
    import: gitrepo.xlaxiata.id/radar/radar-agent-otel-modules/exporter/radarclusterexporter
    path: ./otel-modules

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.158.0
