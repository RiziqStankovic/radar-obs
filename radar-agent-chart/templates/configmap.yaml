{{- if and .Values.agent.collectors.qan.enabled (not .Values.agent.collectors.database.enabled) }}
{{- fail "agent.collectors.qan.enabled requires agent.collectors.database.enabled" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "radar-agent.fullname" . }}-config
  labels:
    {{- include "radar-agent.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: ${env:RADAR_AGENT_HEALTH_ENDPOINT}
      k8s_leader_elector:
        auth_type: serviceAccount
        lease_name: ${env:RADAR_CLUSTER_LEASE_NAME}
        lease_namespace: ${env:RADAR_CLUSTER_LEASE_NAMESPACE}
        lease_duration: 15s
        renew_deadline: 10s
        retry_period: 2s
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:RADAR_OTLP_GRPC_ENDPOINT}
          http:
            endpoint: ${env:RADAR_OTLP_HTTP_ENDPOINT}
{{- if .Values.agent.collectors.cluster.enabled }}
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: ${env:RADAR_CLUSTER_INTERVAL}
        k8s_leader_elector: k8s_leader_elector
      k8s_events:
        auth_type: serviceAccount
        k8s_leader_elector: k8s_leader_elector
      k8s_objects:
        auth_type: serviceAccount
        k8s_leader_elector: k8s_leader_elector
        objects:
          - name: jobs
            mode: watch
          - name: cronjobs
            mode: watch
{{- end }}
{{- if .Values.agent.collectors.database.enabled }}
      postgresqlownership:
        endpoint: ${env:RADAR_DATABASE_POSTGRES_ENDPOINT}
        username: ${env:RADAR_DATABASE_POSTGRES_USERNAME}
        password: ${env:RADAR_DATABASE_POSTGRES_PASSWORD}
        databases:
{{- range .Values.agent.collectors.database.postgres.databases }}
          - {{ . | quote }}
{{- end }}
        collection_interval: ${env:RADAR_DATABASE_POSTGRES_INTERVAL}
        ownership: ${env:RADAR_DATABASE_OWNERSHIP}
        lease_name: ${env:RADAR_DATABASE_LEASE_NAME}
        lease_namespace: ${env:RADAR_DATABASE_LEASE_NAMESPACE}
        lease_identity: ${env:RADAR_DATABASE_LEASE_IDENTITY}
{{- end }}
{{- if and .Values.agent.collectors.node.enabled .Values.agent.collectors.node.hostMetrics }}
      hostmetrics:
        collection_interval: ${env:RADAR_HOST_METRICS_INTERVAL}
        root_path: ${env:RADAR_HOST_ROOT_PATH}
        scrapers:
          cpu: {}
          disk: {}
          filesystem: {}
          load: {}
          memory: {}
          network: {}
          paging: {}
          processes: {}
{{- end }}
{{- if and .Values.agent.collectors.node.enabled .Values.agent.collectors.node.logs }}
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
{{- end }}
{{- if .Values.agent.collectors.qan.enabled }}
      postgresqan:
        dsn: ${env:RADAR_QAN_POSTGRES_DSN}
        service_name: ${env:RADAR_QAN_POSTGRES_SERVICE_NAME}
        agent_id: ${env:RADAR_QAN_AGENT_ID}
        interval: ${env:RADAR_QAN_POSTGRES_INTERVAL}
        include_query_examples: ${env:RADAR_QAN_POSTGRES_QUERY_EXAMPLES}
        lease_name: ${env:RADAR_QAN_LEASE_NAME}
        lease_namespace: ${env:RADAR_QAN_LEASE_NAMESPACE}
        lease_identity: ${env:RADAR_QAN_LEASE_IDENTITY}
{{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 15
      batch:
        timeout: 2s
        send_batch_size: 1024
    exporters:
      otlphttp/radar-gateway:
        endpoint: ${env:RADAR_GATEWAY_OTLP_ENDPOINT}
{{- if or .Values.agent.gateway.existingSecret .Values.agent.config.gatewayApiKey }}
        headers:
          authorization: Bearer ${env:RADAR_GATEWAY_API_KEY}
{{- end }}
        compression: gzip
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 10s
          max_elapsed_time: 30s
{{- if .Values.agent.collectors.qan.enabled }}
      radarqan:
        endpoint: ${env:RADAR_GATEWAY_API_ENDPOINT}
{{- if or .Values.agent.gateway.existingSecret .Values.agent.config.gatewayApiKey }}
        api_key: ${env:RADAR_GATEWAY_API_KEY}
{{- end }}
        timeout: 10s
{{- end }}
    service:
      extensions: [health_check, k8s_leader_elector]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/radar-gateway]
        metrics:
          receivers:
            - otlp
{{- if and .Values.agent.collectors.node.enabled .Values.agent.collectors.node.hostMetrics }}
            - hostmetrics
{{- end }}
          processors: [memory_limiter, batch]
          exporters: [otlphttp/radar-gateway]
{{- if .Values.agent.collectors.cluster.enabled }}
        metrics/cluster:
          receivers: [k8s_cluster]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/radar-gateway]
        logs/kubernetes:
          receivers: [k8s_events, k8s_objects]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/radar-gateway]
{{- end }}
{{- if .Values.agent.collectors.database.enabled }}
        metrics/database:
          receivers: [postgresqlownership]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/radar-gateway]
{{- end }}
        logs:
          receivers:
            - otlp
{{- if and .Values.agent.collectors.node.enabled .Values.agent.collectors.node.logs }}
            - filelog
{{- end }}
          processors: [memory_limiter, batch]
          exporters: [otlphttp/radar-gateway]
{{- if .Values.agent.collectors.qan.enabled }}
        logs/qan:
          receivers: [postgresqan]
          processors: [memory_limiter, batch]
          exporters: [radarqan]
{{- end }}
  qan-targets.yaml: |
    ownership: {{ .Values.agent.collectors.qan.ownership | quote }}
    leaseName: {{ .Values.agent.collectors.qan.leaseName | quote }}
    includeQueryExamples: {{ .Values.agent.collectors.qan.includeQueryExamples | default false }}
    targets:
{{- range .Values.agent.collectors.database.targets }}
      - name: {{ .name | quote }}
        engine: {{ .engine | quote }}
        endpoint: {{ .endpoint | quote }}
        database: {{ .database | default "" | quote }}
        interval: {{ .interval | default "30s" | quote }}
        secretRef:
          name: {{ .existingSecret | quote }}
          usernameKey: {{ .usernameKey | default "username" | quote }}
          passwordKey: {{ .passwordKey | default "password" | quote }}
{{- end }}
    qanTargets:
{{- range .Values.agent.collectors.qan.targets }}
      - name: {{ .name | quote }}
        databaseTarget: {{ .databaseTarget | quote }}
        interval: {{ .interval | default "60s" | quote }}
{{- end }}
