apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "radar-agent.fullname" . }}
  labels:
    {{- include "radar-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "radar-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "radar-agent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "radar-agent.fullname" . }}
      containers:
        - name: radar-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args: ["--config=/etc/radar-agent/collector.yaml"]
          # Kubernetes pod logs are commonly root:root 0640 on the node.
          # The filelog receiver needs read access to the host log files.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.agent.ports.otlpGrpc }}
            - name: otlp-http
              containerPort: {{ .Values.agent.ports.otlpHttp }}
            - name: health
              containerPort: {{ .Values.agent.ports.health }}
          env:
            - name: RADAR_AGENT_HEALTH_ENDPOINT
              value: {{ .Values.agent.config.healthEndpoint | quote }}
            - name: RADAR_OTLP_GRPC_ENDPOINT
              value: "0.0.0.0:{{ .Values.agent.ports.otlpGrpc }}"
            - name: RADAR_OTLP_HTTP_ENDPOINT
              value: "0.0.0.0:{{ .Values.agent.ports.otlpHttp }}"
            - name: RADAR_GATEWAY_OTLP_ENDPOINT
              value: {{ .Values.agent.config.gatewayOtlpEndpoint | quote }}
            - name: RADAR_GATEWAY_API_ENDPOINT
              value: {{ .Values.agent.config.gatewayApiEndpoint | default "http://radar-gateway-api:4320" | quote }}
            - name: RADAR_COLLECTOR_NODE_ENABLED
              value: {{ .Values.agent.collectors.node.enabled | quote }}
            - name: RADAR_COLLECTOR_DATABASE_ENABLED
              value: {{ .Values.agent.collectors.database.enabled | quote }}
            - name: RADAR_COLLECTOR_QAN_ENABLED
              value: {{ .Values.agent.collectors.qan.enabled | quote }}
            - name: RADAR_CLUSTER_INTERVAL
              value: {{ .Values.agent.collectors.cluster.interval | default "30s" | quote }}
            - name: RADAR_CLUSTER_LEASE_NAME
              value: {{ .Values.agent.collectors.cluster.leaseName | quote }}
            - name: RADAR_CLUSTER_LEASE_NAMESPACE
              value: {{ .Values.agent.collectors.cluster.leaseNamespace | default .Release.Namespace | quote }}
{{- if .Values.agent.collectors.database.enabled }}
            - name: RADAR_DATABASE_POSTGRES_ENDPOINT
              value: {{ .Values.agent.collectors.database.postgres.endpoint | quote }}
            - name: RADAR_DATABASE_POSTGRES_USERNAME
              value: {{ .Values.agent.collectors.database.postgres.username | quote }}
            - name: RADAR_DATABASE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.collectors.database.postgres.existingSecret | quote }}
                  key: {{ .Values.agent.collectors.database.postgres.passwordKey | default "password" | quote }}
            - name: RADAR_DATABASE_POSTGRES_INTERVAL
              value: {{ .Values.agent.collectors.database.postgres.interval | default "30s" | quote }}
{{- end }}
            - name: RADAR_DATABASE_OWNERSHIP
              value: {{ .Values.agent.collectors.database.ownership | quote }}
            - name: RADAR_DATABASE_LEASE_NAME
              value: {{ .Values.agent.collectors.database.leaseName | quote }}
            - name: RADAR_DATABASE_LEASE_NAMESPACE
              value: {{ .Values.agent.collectors.database.leaseNamespace | default .Release.Namespace | quote }}
            - name: RADAR_DATABASE_LEASE_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RADAR_QAN_DATABASE_LEASE_NAME
              value: {{ .Values.agent.collectors.database.leaseName | quote }}
            - name: RADAR_QAN_LEASE_NAMESPACE
              value: {{ .Values.agent.collectors.qan.leaseNamespace | default .Release.Namespace | quote }}
            - name: RADAR_QAN_LEASE_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RADAR_QAN_DISABLE_QUERY_EXAMPLES
              value: {{ (not .Values.agent.collectors.qan.includeQueryExamples) | quote }}
            - name: RADAR_QAN_POSTGRES_DSN
              value: {{ .Values.agent.collectors.qan.dsn | quote }}
            - name: RADAR_QAN_POSTGRES_SERVICE_NAME
              value: {{ .Values.agent.collectors.qan.serviceName | default "postgresql" | quote }}
            - name: RADAR_QAN_POSTGRES_INTERVAL
              value: {{ .Values.agent.collectors.qan.interval | default "60s" | quote }}
            - name: RADAR_QAN_POSTGRES_QUERY_EXAMPLES
              value: {{ .Values.agent.collectors.qan.includeQueryExamples | quote }}
            - name: RADAR_QAN_AGENT_ID
              value: {{ include "radar-agent.fullname" . | quote }}
            - name: RADAR_GATEWAY_API_KEY
              value: {{ .Values.agent.config.gatewayApiKey | default "" | quote }}
            - name: NO_PROXY
              value: ".svc,.svc.cluster.local,.cluster.local,localhost,127.0.0.1"
            - name: no_proxy
              value: ".svc,.svc.cluster.local,.cluster.local,localhost,127.0.0.1"
            - name: RADAR_HOST_METRICS_INTERVAL
              value: {{ .Values.agent.config.hostMetricsInterval | quote }}
            - name: RADAR_KUBELET_METRICS_INTERVAL
              value: {{ .Values.agent.config.kubeletMetricsInterval | quote }}
            - name: RADAR_KUBELET_ENDPOINT
              value: "https://${K8S_NODE_IP}:10250"
            - name: RADAR_KUBELET_INSECURE_SKIP_VERIFY
              value: {{ .Values.agent.config.kubeletInsecureSkipVerify | quote }}
            - name: RADAR_HOST_ROOT_PATH
              value: {{ .Values.agent.config.hostRootPath | quote }}
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: config
              mountPath: /etc/radar-agent
              readOnly: true
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
{{- if and .Values.agent.collectors.node.enabled .Values.agent.collectors.node.logs }}
            - name: varlog
              mountPath: /var/log
              readOnly: true
{{- end }}
{{- range .Values.agent.collectors.database.targets }}
            - name: db-secret-{{ .name | kebabcase }}
              mountPath: /etc/radar-agent/secrets/{{ .name | kebabcase }}
              readOnly: true
{{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: health
          readinessProbe:
            httpGet:
              path: /
              port: health
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "radar-agent.fullname" . }}-config
        - name: hostfs
          hostPath:
            path: /
            type: Directory
{{- if and .Values.agent.collectors.node.enabled .Values.agent.collectors.node.logs }}
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
{{- end }}
{{- range .Values.agent.collectors.database.targets }}
        - name: db-secret-{{ .name | kebabcase }}
          secret:
            secretName: {{ .existingSecret | quote }}
            items:
              - key: {{ .usernameKey | default "username" | quote }}
                path: username
              - key: {{ .passwordKey | default "password" | quote }}
                path: password
{{- end }}
      tolerations:
        {{- toYaml .Values.agent.tolerations | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.agent.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.agent.affinity | nindent 8 }}
